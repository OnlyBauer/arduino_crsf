name=CrsfPort
version=0.1.0
author=Maximilian Bauer <maximilian@bauer.pub>
maintainer=Maximilian Bauer <maximilian@bauer.pub>
sentence=Complete TBS CRSFv3: telemetry, RC channels, parameters, MAVLink and MSP tunnels, commands and routing.
paragraph=An Arduino wrapper over the portable c_crsf core, which also runs on ESP-IDF and STM32. Frame layer with both header forms and both CRC polynomials, the full telemetry set, 0x16/0x17/0x18 channels, the parameter protocol in both directions, MAVLink and MSP tunnels with chunking and reassembly, 0x32 Direct Commands, multi-port routing and CRSFv3 baudrate negotiation. AVR is not supported: the core needs about 3.5 KB of RAM against an ATmega328P's 2 KB. This version compiles for four architectures and passes the host test suites, but has NOT been verified against radio hardware.
category=Communication
url=https://git.bauer.pub/Bauer/arduino_crsf
architectures=esp32,stm32,rp2040,samd
license=Apache-2.0
