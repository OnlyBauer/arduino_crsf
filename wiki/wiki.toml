# What tools/wiki_build.py needs to know about this repository.
# The script is identical in all four; everything that differs is here.

title = "CRSFv3"

[pages]
"README.md" = "Home"
"COMPLIANCE.md" = "Compliance"
"CHANGELOG.md" = "Changelog"

[sidebar]
order = [
    "Home",
    "Getting-Started",
    "Examples",
    "Hardware-Status",
    "Vendored-Core",
    "API-Reference",
    "Compliance",
    "Changelog",
]

[examples]
glob = "examples/*/*.ino"
intro = "Open any of these from the IDE's File > Examples > CRSFv3 menu, or:"
build = "arduino-cli compile --fqbn esp32:esp32:esp32 --library . examples/<Name>/<Name>.ino"

[api]
modules = ["src/CRSFv3.h", "src/crsf_arduino_conf.h", "src/crsf_*.h", "src/crsf_*.c"]
note = "`CRSFv3.h` is the Arduino wrapper. Every `crsf_*` file beside it is the shared protocol core, vendored flat because the Arduino library format only puts `src/` itself on the include path."
