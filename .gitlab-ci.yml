# CI for the Arduino library CRSFv3. Five stages, fast to slow:
#
#   lint     Formatting, static analysis, arduino-lint, version consistency.
#   test     Host unit tests against a mock Arduino runtime.
#   build    Every example compiled for all four architectures.
#   docs     Doxygen, with WARN_AS_ERROR.
#   release  An annotated tag becomes a GitLab release object.
#
# The protocol is not tested here -- it is c_crsf, checked in its own
# repository. This repository tests the Arduino layer on top of it.

stages:
  - lint
  - test
  - build
  - docs
  - release

variables:
  # Shallow clone, enough for everything here.
  GIT_DEPTH: "20"

# No duplicate pipelines: with an open merge request, only the MR pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# --- lint ---------------------------------------------------------------------

# The image is pinned to a major version because clang-format's output changes
# between them -- otherwise this job goes red on something nobody can reproduce
# locally. --strict makes a missing tool a failure, not a SKIP.
lint:
  stage: lint
  image: silkeh/clang:20
  before_script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
  script:
    - bash tools/ci.sh lint --strict

# The version is written in four files; all must agree with the tag.
#
#   release_X.Y.Z          -> X.Y.Z
#   prerelease_X.Y.Z_dev   -> X.Y.Z-dev   (semver needs the hyphen, the tag
#                                          cannot have one)
#
# This matters more than usual here: library.properties is what the Arduino
# Library Manager reads out of the tag, so a wrong version gets published rather
# than just sitting wrong locally. The Doxyfile is included because that is
# where esp_crsf's version silently stayed at 0.3.0.
version-matches-tag:
  stage: lint
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu

      # X.Y.Z: three components, all purely numeric, nothing after them.
      is_core() {
        IFS=. read -r a b c extra <<INNER
      $1
      INNER
        [ -n "$a" ] && [ -n "$b" ] && [ -n "$c" ] && [ -z "$extra" ] || return 1
        for n in "$a" "$b" "$c"; do
          case "$n" in ""|*[!0-9]*) return 1 ;; esac
        done
      }

      tag=$CI_COMMIT_TAG
      case "$tag" in
        release_*)
          core=${tag#release_}
          want=$core
          ;;
        prerelease_*)
          core=${tag#prerelease_}
          core=${core%_dev}
          [ "$tag" = "prerelease_${core}_dev" ] || {
            echo "Tag '$tag': expected prerelease_X.Y.Z_dev"; exit 1; }
          want="$core-dev"
          ;;
        *)
          echo "Tag '$tag' matches no scheme."
          echo "Allowed: release_X.Y.Z or prerelease_X.Y.Z_dev"
          exit 1
          ;;
      esac
      is_core "$core" || {
        echo "Tag '$tag': X.Y.Z must be three numbers, read '$core'"
        exit 1; }

      fail=0
      check() {  # name, value read
        echo "  $1: $2"
        [ "$2" = "$want" ] || { echo "    ...expected '$want'"; fail=1; }
      }

      echo "Tag:      $tag"
      echo "expected: $want"
      have_p=$(sed -n 's/^version=//p' library.properties)
      have_j=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' library.json)
      check "library.properties" "$have_p"
      check "library.json      " "$have_j"
      check "Doxyfile          " "$(sed -n 's/^PROJECT_NUMBER *= *//p' Doxyfile | tr -d '"[:space:]')"
      check "VERSION           " "$(tr -d '[:space:]' < VERSION)"
      [ "$fail" -eq 0 ] || { echo; echo "Version and tag disagree."; exit 1; }
      echo "Every version matches the tag."

# The vendored core must not be edited here. What is compared is the git tree
# hash from c_crsf.pin.
vendor-unmodified:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  script:
    - bash tools/sync_core.sh --check

# arduino-lint checks library.properties, the src/ layout and the
# examples/<Name>/<Name>.ino rule.
#
# LIBRARY_MANAGER_MODE must be switched by hand once the registry accepts the
# library. The modes check opposite things:
#
#   submit   Not indexed yet. LP017 fails if the name is already taken.
#   update   Indexed. LP018 fails if the name is *not* found.
#
# Left on submit after acceptance, LP017 fires against our own entry. After
# switching, LP018 fails for up to a day until the index rebuilds; it clears
# itself.
#
# ci.sh lints a copy of the tracked files: LS007 fails on any .exe, and the
# ignored build_*/ directories are full of them.
arduino-lint:
  stage: lint
  image: debian:bookworm-slim
  variables:
    LIBRARY_MANAGER_MODE: submit
  before_script:
    - apt-get update -qq
    # git and tar: ci.sh copies the tracked files out with them.
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git tar
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | BINDIR=/usr/local/bin sh
  script:
    - bash tools/ci.sh arduino-lint --strict

# --- test ---------------------------------------------------------------------

# tests/Makefile already sets -Werror.
unit-tests:
  stage: test
  image: gcc:14
  script:
    - mkdir -p build_tests
    - make -C tests > build_tests/test-output.txt 2>&1 || true
    - cat build_tests/test-output.txt
    - bash tools/junit_from_tests.sh build_tests/test-output.txt > build_tests/junit.xml
    - grep -q "All .* suites passed" build_tests/test-output.txt
  artifacts:
    when: always
    paths:
      - build_tests/
    reports:
      junit: build_tests/junit.xml
    expire_in: 1 week

# A read outside a buffer only shows up under ASan. Separate target because
# Cygwin has no libasan.
unit-tests-sanitized:
  stage: test
  image: gcc:14
  variables:
    ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  script:
    - make -C tests sanitize

# --- build --------------------------------------------------------------------

# --library . builds against the working tree instead of a sketchbook install.
# The cache is not optional: the esp32 core alone is ~250 MB.
build-examples:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  parallel:
    matrix:
      - CORE: "esp32:esp32"
        FQBN: "esp32:esp32:esp32"
        INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - CORE: "rp2040:rp2040"
        FQBN: "rp2040:rp2040:rpipico"
        INDEX: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json"
      - CORE: "STMicroelectronics:stm32"
        FQBN: "STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_F411RE"
        INDEX: "https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"
      - CORE: "arduino:samd"
        FQBN: "arduino:samd:mkrzero"
        INDEX: ""
      # AVR needs the minimal profile, and only the two station examples fit
      # the subset it leaves. EXAMPLES and EXTRA are empty for every other
      # cell, which then builds all six with no extra flags.
      - CORE: "arduino:avr"
        FQBN: "arduino:avr:nano"
        INDEX: ""
        EXAMPLES: "CrsfRxStation CrsfTxStation"
        EXTRA: "-DCRSF_ARDUINO_MINIMAL=1"
  cache:
    key: "arduino-$CORE"
    paths:
      - .arduino15/
      - .arduino-dl/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git python3
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index ${INDEX:+--additional-urls "$INDEX"}
    - arduino-cli core install "$CORE" ${INDEX:+--additional-urls "$INDEX"}
    - |
      set -e
      names="${EXAMPLES:-}"
      if [ -z "$names" ]; then
        names=$(for ex in examples/*/; do basename "$ex"; done)
      fi
      props=""
      if [ -n "${EXTRA:-}" ]; then
        props="--build-property compiler.cpp.extra_flags=$EXTRA"
        props="$props --build-property compiler.c.extra_flags=$EXTRA"
      fi
      for name in $names; do
        echo "=== $name ($FQBN) ==="
        arduino-cli compile --fqbn "$FQBN" --library . --warnings more \
          $props --output-dir "build_arduino/$name" "examples/$name/$name.ino"
      done
  artifacts:
    when: on_failure
    paths:
      - build_arduino/**/*.map
    expire_in: 1 week

# The RAM and flash a real AVR build costs, so the README's table is measured
# rather than asserted. Also the regression guard on the feature switches: if a
# change pushes a station sketch back over an ATmega328P's 2048 bytes, this is
# where it shows.
size-avr:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  cache:
    key: "arduino-arduino:avr"
    paths:
      - .arduino15/
      - .arduino-dl/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git python3
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index
    - arduino-cli core install arduino:avr
    - |
      set -e
      for name in CrsfRxStation CrsfTxStation; do
        echo "=== $name on arduino:avr:nano, CRSF_ARDUINO_MINIMAL ==="
        arduino-cli compile --fqbn arduino:avr:nano --library . \
          --build-property compiler.cpp.extra_flags=-DCRSF_ARDUINO_MINIMAL=1 \
          --build-property compiler.c.extra_flags=-DCRSF_ARDUINO_MINIMAL=1 \
          "examples/$name/$name.ino" 2>&1 | grep -Ei 'sketch uses|global variables'
      done

# --- docs ---------------------------------------------------------------------

doxygen:
  stage: docs
  image: alpine:3.20
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile

# Publish the API documentation from main.
#
# allow_failure for a reason outside this repository: the instance's nginx caps
# requests at 1 MB and the artifact is larger, so the upload 413s. Pages is fed
# only through that artifact, so it cannot be optimised away. Lift the cap with
# nginx['client_max_body_size'] = '0' in /etc/gitlab/gitlab.rb, and drop this
# allow_failure with it.
pages:
  stage: docs
  image: alpine:3.20
  needs:
    - job: doxygen
      artifacts: false
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile
    - mkdir -p public/docs
    - mv docs/html/* public/docs/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- release ------------------------------------------------------------------

# An annotated tag becomes a GitLab release object, so Releases is not an empty
# page.
#
# The description comes from CHANGELOG.md, not the tag message: the changelog is
# reviewed in the merge request. changelog_section.py errors out if the section
# is missing, so you cannot tag without having written it.
#
# Only release_*, not prerelease_*. Assets are links to archives GitLab
# generates on request -- an upload would hit the same 1 MB cap as pages.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version-matches-tag
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: vendor-unmodified
      artifacts: false
    - job: arduino-lint
      artifacts: false
    - job: doxygen
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release_[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 tools/changelog_section.py "${CI_COMMIT_TAG#release_}" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "CRSFv3 ${CI_COMMIT_TAG#release_}"
    description: ./release_notes.md
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: "Source (tar.gz)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tar.gz"
          link_type: package
        - name: "Source (zip)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
          link_type: package
