# CI for the Arduino library CRSFv3.
#
# Five stages, fast to slow:
#
#   lint     Formatting, whitespace, static analysis, the Arduino specification
#            via arduino-lint, and the check that every place a version is
#            written says the same one.
#   test     Host unit tests from tests/ -- plain gcc against a mock Arduino
#            runtime, no target platform, runs in seconds.
#   build    Compiles every example for each of the four supported
#            architectures with arduino-cli. This is the stage that catches a
#            sketch which no longer builds on a board nobody has to hand.
#   docs     Doxygen. The Doxyfile has WARN_AS_ERROR = FAIL_ON_WARNINGS, so the
#            job fails as soon as a public declaration is undocumented or an
#            @param no longer matches the signature.
#   release  Turns an annotated tag into a GitLab release object.
#
# The protocol itself is not tested here. It is c_crsf, vendored into src/ and
# checked in its own repository; the vendor-unmodified job proves the copy is
# unchanged. What this repository tests is the Arduino layer on top of it.

stages:
  - lint
  - test
  - build
  - docs
  - release

variables:
  # Shallow clone, enough for everything here.
  GIT_DEPTH: "20"

# No duplicate pipelines: with an open merge request, only the MR pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# --- lint ---------------------------------------------------------------------

# Formatting and static analysis.
#
# Why the image is pinned to a major version: clang-format's output changes
# between major versions. If a different one runs here than locally, this job
# goes red although `tools/ci.sh lint` was green on the machine -- and nobody
# can reproduce it.
#
# The job calls tools/ci.sh rather than the tools directly: otherwise there are
# two implementations of the same check, and they drift. --strict turns a
# missing tool into a failure rather than a SKIP, because in CI a silently
# skipped lint is worth nothing.
lint:
  stage: lint
  image: silkeh/clang:20
  before_script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
  script:
    - bash tools/ci.sh lint --strict

# A version appears in several places; all of them must say the same thing.
#
# Tag scheme:
#   release_X.Y.Z          -> VERSION: X.Y.Z
#   prerelease_X.Y.Z_dev   -> VERSION: X.Y.Z-dev
#
# The tag name is a git reference and may look however it likes. The version may
# not: semver appends a pre-release marker with a hyphen, so "0.4.0_dev" is not
# a valid version, although "prerelease_0.4.0_dev" is a perfectly usable tag.
#
# Why check at all: "tagged as X, the file still says Y" is the classic release
# mistake, and it only shows up once somebody pulls the library. For this
# library it is worse than usual, because library.properties is exactly what the
# Arduino Library Manager reads out of the tag -- a wrong version there gets
# published, not merely left wrong locally. The Doxyfile is explicitly included:
# that is precisely where the version in esp_crsf silently stayed at 0.3.0,
# because nobody read it.
version-matches-tag:
  stage: lint
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu

      # X.Y.Z: three components, all purely numeric, nothing after them.
      is_core() {
        IFS=. read -r a b c extra <<INNER
      $1
      INNER
        [ -n "$a" ] && [ -n "$b" ] && [ -n "$c" ] && [ -z "$extra" ] || return 1
        for n in "$a" "$b" "$c"; do
          case "$n" in ""|*[!0-9]*) return 1 ;; esac
        done
      }

      tag=$CI_COMMIT_TAG
      case "$tag" in
        release_*)
          core=${tag#release_}
          want=$core
          ;;
        prerelease_*)
          core=${tag#prerelease_}
          core=${core%_dev}
          [ "$tag" = "prerelease_${core}_dev" ] || {
            echo "Tag '$tag': expected prerelease_X.Y.Z_dev"; exit 1; }
          want="$core-dev"
          ;;
        *)
          echo "Tag '$tag' matches no scheme."
          echo "Allowed: release_X.Y.Z or prerelease_X.Y.Z_dev"
          exit 1
          ;;
      esac
      is_core "$core" || {
        echo "Tag '$tag': X.Y.Z must be three numbers, read '$core'"
        exit 1; }

      fail=0
      check() {  # name, value read
        echo "  $1: $2"
        [ "$2" = "$want" ] || { echo "    ...expected '$want'"; fail=1; }
      }

      echo "Tag:      $tag"
      echo "expected: $want"
      have_p=$(sed -n 's/^version=//p' library.properties)
      have_j=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' library.json)
      check "library.properties" "$have_p"
      check "library.json      " "$have_j"
      check "Doxyfile          " "$(sed -n 's/^PROJECT_NUMBER *= *//p' Doxyfile | tr -d '"[:space:]')"
      check "VERSION           " "$(tr -d '[:space:]' < VERSION)"
      [ "$fail" -eq 0 ] || { echo; echo "Version and tag disagree."; exit 1; }
      echo "Every version matches the tag."

# The vendored core must not be edited here. What is compared is the git tree
# hash from c_crsf.pin.
vendor-unmodified:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  script:
    - bash tools/sync_core.sh --check

# arduino-lint checks library.properties, the src/ layout and the
# examples/<Name>/<Name>.ino rule: the things that break quietly.
#
# LIBRARY_MANAGER_MODE has to be changed once, by hand, when the library is
# accepted into the registry. The two modes check opposite things:
#
#   submit   Not in the index yet. LP017 fails if the name is already taken,
#            which is the likeliest reason a submission is turned away. That is
#            what it is set to now.
#   update   In the index. LP018 fails if the name is *not* found, catching a
#            rename the registry does not allow, and --compliance strict
#            promotes LP022 (tag ahead of the version field) to an error.
#
# Left on submit after acceptance, LP017 fires against our own index entry.
# After switching to update, LP018 keeps failing for up to a day, until the
# index has actually been rebuilt with the new entry; it clears itself.
#
# The job calls tools/ci.sh, which lints a copy of the tracked files rather than
# the checkout: rule LS007 fails on any .exe, and build_tests/ is full of them
# on a Windows machine -- build_wiki/ additionally holds a whole nested git
# clone of the wiki.
arduino-lint:
  stage: lint
  image: debian:bookworm-slim
  variables:
    LIBRARY_MANAGER_MODE: submit
  before_script:
    - apt-get update -qq
    # git and tar: ci.sh copies the tracked files out with them.
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git tar
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | BINDIR=/usr/local/bin sh
  script:
    - bash tools/ci.sh arduino-lint --strict

# --- test ---------------------------------------------------------------------

# The suites from tests/Makefile. -Werror is already set there, so a warning
# breaks the build in any case.
unit-tests:
  stage: test
  image: gcc:14
  script:
    - mkdir -p build_tests
    - make -C tests > build_tests/test-output.txt 2>&1 || true
    - cat build_tests/test-output.txt
    - bash tools/junit_from_tests.sh build_tests/test-output.txt > build_tests/junit.xml
    - grep -q "All .* suites passed" build_tests/test-output.txt
  artifacts:
    when: always
    paths:
      - build_tests/
    reports:
      junit: build_tests/junit.xml
    expire_in: 1 week

# The suites check invariants and output bounds, but a read outside a buffer
# only shows up under ASan. That is what the sanitize target in the Makefile is
# for -- here there is a toolchain that can do it. Locally on Cygwin there is
# not, which is why it is a target of its own.
unit-tests-sanitized:
  stage: test
  image: gcc:14
  variables:
    ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  script:
    - make -C tests sanitize

# --- build --------------------------------------------------------------------

# Compile the examples for four architectures.
#
# --library . builds against the working tree without installing into a
# sketchbook first; without it arduino-cli does not find the library and the
# examples fail for the wrong reason.
#
# The cache is not optional: the esp32 core is around 250 MB, and without it
# every matrix cell downloads everything again.
build-examples:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  parallel:
    matrix:
      - CORE: "esp32:esp32"
        FQBN: "esp32:esp32:esp32"
        INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - CORE: "rp2040:rp2040"
        FQBN: "rp2040:rp2040:rpipico"
        INDEX: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json"
      - CORE: "STMicroelectronics:stm32"
        FQBN: "STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_F411RE"
        INDEX: "https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"
      - CORE: "arduino:samd"
        FQBN: "arduino:samd:mkrzero"
        INDEX: ""
  cache:
    key: "arduino-$CORE"
    paths:
      - .arduino15/
      - .arduino-dl/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git python3
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index ${INDEX:+--additional-urls "$INDEX"}
    - arduino-cli core install "$CORE" ${INDEX:+--additional-urls "$INDEX"}
    - |
      set -e
      for ex in examples/*/; do
        name=$(basename "$ex")
        echo "=== $name ($FQBN) ==="
        arduino-cli compile --fqbn "$FQBN" --library . --warnings more                             --output-dir "build_arduino/$name" "$ex$name.ino"
      done
  artifacts:
    when: on_failure
    paths:
      - build_arduino/**/*.map
    expire_in: 1 week

# --- docs ---------------------------------------------------------------------

doxygen:
  stage: docs
  image: alpine:3.20
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile

# GitLab Pages: publish the generated API documentation from main.
#
# Does not block the pipeline, for a reason that has nothing to do with this
# repository: the nginx in front of the instance accepts 1 MB per request, the
# public artifact is larger, and the upload ends with "413 Request Entity Too
# Large". Pages is filled exclusively through that artifact, so it cannot be
# optimised away. As soon as the limit is raised, the job publishes by itself:
#
#   nginx['client_max_body_size'] = '0'   in /etc/gitlab/gitlab.rb
#   + gitlab-ctl reconfigure
#
# The same limit caps git-push over HTTPS and every attachment in the web UI, by
# the way. When it goes, this allow_failure should go with it.
pages:
  stage: docs
  image: alpine:3.20
  needs:
    - job: doxygen
      artifacts: false
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile
    - mkdir -p public/docs
    - mv docs/html/* public/docs/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- release ------------------------------------------------------------------

# Turns an annotated tag into a GitLab release object.
#
# Why at all: before, a release was a tag and nothing else. Anyone pulling the
# library sees an empty page under Releases and has to go looking for the
# changelog in the repository. The release object is where GitLab, the API and
# every integration look it up.
#
# The description comes from CHANGELOG.md and not from the tag message: the
# changelog is read and reviewed in the merge request, a tag message is not.
# tools/changelog_section.py cuts the section out and exits with an error if it
# does not exist -- so you cannot tag without having written the entry.
#
# Only release_*, not prerelease_*: a release is something you install.
#
# No uploaded assets, but links to archives GitLab generates on request. That is
# not a style decision: an upload would run into the same 1 MB limit as pages
# above. A source archive of the tag contains the library in full anyway.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version-matches-tag
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: vendor-unmodified
      artifacts: false
    - job: arduino-lint
      artifacts: false
    - job: doxygen
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release_[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 tools/changelog_section.py "${CI_COMMIT_TAG#release_}" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "CRSFv3 ${CI_COMMIT_TAG#release_}"
    description: ./release_notes.md
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: "Source (tar.gz)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tar.gz"
          link_type: package
        - name: "Source (zip)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
          link_type: package
