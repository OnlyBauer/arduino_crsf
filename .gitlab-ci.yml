# CI für die Arduino-Bibliothek CrsfPort.
#
# Vier Stufen, von schnell nach langsam:
#
#   lint     Formatierung, Whitespace, statische Analyse und die Prüfung, dass
#            jede Stelle, an der eine Version steht, dieselbe nennt.
#   test     Host-Unit-Tests aus tests/ — reiner gcc, keine Zielplattform, läuft
#            in Sekunden und fängt praktisch alle Protokollfehler ab.
#   docs     Doxygen. Das Doxyfile hat WARN_AS_ERROR = FAIL_ON_WARNINGS, der Job
#            schlägt also fehl, sobald eine öffentliche Deklaration
#            undokumentiert ist oder ein @param nicht mehr zur Signatur passt.
#   release  Erzeugt aus einem annotierten Tag ein GitLab-Release-Objekt.
#
# Es gibt hier bewusst keine build-Stufe. Diese Bibliothek hat keine
# Zielplattform: was sie braucht, ist ein C11-Compiler, und den benutzt die
# test-Stufe bereits. Ob sie sich für einen ESP32, ein STM32 oder ein Arduino
# übersetzen lässt, prüfen die jeweiligen Port-Repositories — dort gehört es
# hin, denn dort steht auch die Toolchain.
#
# tbs-crsf-spec ist nur Referenzdokumentation und wird für keinen Job gebraucht.
# GIT_SUBMODULE_STRATEGY bleibt deshalb auf dem Standard none.

stages:
  - lint
  - test
  - build
  - docs
  - release

variables:
  # Flacher Klon, das reicht für alles hier.
  GIT_DEPTH: "20"

# Keine doppelten Pipelines: bei offenem Merge Request nur die MR-Pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# --- lint ---------------------------------------------------------------------

# Formatierung und statische Analyse.
#
# Warum das Image auf eine Hauptversion festgenagelt ist: die Ausgabe von
# clang-format ändert sich zwischen Hauptversionen. Läuft hier eine andere als
# lokal, wird dieser Job rot, obwohl `tools/ci.sh lint` auf dem Rechner grün
# war — und niemand kann es nachvollziehen.
#
# Der Job ruft tools/ci.sh auf und nicht die Werkzeuge direkt: sonst gibt es
# zwei Implementierungen derselben Prüfung, die auseinanderlaufen. --strict
# macht aus einem fehlenden Werkzeug einen Fehlschlag statt eines SKIP, denn in
# CI ist ein stillschweigend übersprungener Lint wertlos.
lint:
  stage: lint
  image: silkeh/clang:20
  before_script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
  script:
    - bash tools/ci.sh lint --strict

# Eine Version steht an vier Stellen; alle vier müssen dasselbe sagen.
#
# Tag-Schema:
#   release_X.Y.Z          -> VERSION: X.Y.Z
#   prerelease_X.Y.Z_dev   -> VERSION: X.Y.Z-dev
#
# Der Tag-Name ist eine Git-Referenz und darf aussehen, wie er will. Die Version
# darf das nicht: Semver hängt ein Vorabkennzeichen mit Bindestrich an, also ist
# "0.4.0_dev" keine gültige Version, obwohl "prerelease_0.4.0_dev" ein völlig
# brauchbarer Tag ist.
#
# Warum überhaupt geprüft: "getaggt als X, in der Datei steht noch Y" ist der
# klassische Release-Fehler, und er fällt erst auf, wenn jemand die Bibliothek
# zieht. Das Doxyfile ist ausdrücklich mit dabei — genau dort ist die Version in
# esp_crsf unbemerkt auf 0.3.0 stehengeblieben, weil sie niemand gelesen hat.
version-matches-tag:
  stage: lint
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu

      # X.Y.Z: drei Komponenten, alle rein numerisch, nichts dahinter.
      is_core() {
        IFS=. read -r a b c extra <<INNER
      $1
      INNER
        [ -n "$a" ] && [ -n "$b" ] && [ -n "$c" ] && [ -z "$extra" ] || return 1
        for n in "$a" "$b" "$c"; do
          case "$n" in ""|*[!0-9]*) return 1 ;; esac
        done
      }

      tag=$CI_COMMIT_TAG
      case "$tag" in
        release_*)
          core=${tag#release_}
          want=$core
          ;;
        prerelease_*)
          core=${tag#prerelease_}
          core=${core%_dev}
          [ "$tag" = "prerelease_${core}_dev" ] || {
            echo "Tag '$tag': erwartet wird prerelease_X.Y.Z_dev"; exit 1; }
          want="$core-dev"
          ;;
        *)
          echo "Tag '$tag' passt in kein Schema."
          echo "Erlaubt: release_X.Y.Z oder prerelease_X.Y.Z_dev"
          exit 1
          ;;
      esac
      is_core "$core" || {
        echo "Tag '$tag': X.Y.Z muss aus drei Zahlen bestehen, gelesen wurde '$core'"
        exit 1; }

      fail=0
      check() {  # name, gelesener Wert
        echo "  $1: $2"
        [ "$2" = "$want" ] || { echo "    ...erwartet wurde '$want'"; fail=1; }
      }

      echo "Tag:      $tag"
      echo "erwartet: $want"
      have_p=$(sed -n 's/^version=//p' library.properties)
      have_j=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' library.json)
      check "library.properties" "$have_p"
      check "library.json      " "$have_j"
      check "Doxyfile          " "$(sed -n 's/^PROJECT_NUMBER *= *//p' Doxyfile | tr -d '"[:space:]')"
      [ "$fail" -eq 0 ] || { echo; echo "Version und Tag stimmen nicht überein."; exit 1; }
      echo "Alle Versionsangaben stimmen mit dem Tag überein."

# Der eingebettete Kern darf hier nicht bearbeitet werden. Verglichen wird der
# Git-Baum-Hash aus c_crsf.pin.
vendor-unmodified:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  script:
    - bash tools/sync_core.sh --check

# arduino-lint prueft library.properties, den src/-Aufbau und die Regel
# examples/<Name>/<Name>.ino -- also genau die drei Dinge, die still kaputtgehen
# und die man sonst erst von einem Benutzer erfaehrt.
#
# --library-manager update statt submit: submit verlangt oeffentliches
# Git-Hosting, und git.bauer.pub ist selbst gehostet.
arduino-lint:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-lint --compliance strict --library-manager update --recursive

# --- test ---------------------------------------------------------------------

# Die Suiten aus tests/Makefile. -Werror ist dort schon gesetzt, eine Warnung
# bricht den Build also ohnehin ab.
unit-tests:
  stage: test
  image: gcc:14
  script:
    - make -C tests
  artifacts:
    when: on_failure
    paths:
      - build_tests/
    expire_in: 1 week

# Die Fuzz-Suite prüft Invarianten und Ausgabegrenzen, aber ein Lesezugriff
# außerhalb eines Puffers fällt nur unter ASan auf. Genau dafür ist das
# sanitize-Target im Makefile gedacht — hier gibt es eine Toolchain, die es kann.
# Lokal auf Cygwin gibt es sie nicht, deshalb ist es ein eigenes Target.
unit-tests-sanitized:
  stage: test
  image: gcc:14
  variables:
    ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  script:
    - make -C tests sanitize

# --- build --------------------------------------------------------------------

# Die Beispiele fuer vier Architekturen uebersetzen.
#
# --library . baut gegen den Arbeitsbaum, ohne vorher in ein Sketchbook zu
# installieren; ohne das findet arduino-cli die Bibliothek nicht und die
# Beispiele scheitern aus dem falschen Grund.
#
# Der Cache ist nicht optional: der esp32-Core ist rund 250 MB, und ohne ihn
# laedt jede Matrix-Zelle alles neu.
build-examples:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  parallel:
    matrix:
      - CORE: "esp32:esp32"
        FQBN: "esp32:esp32:esp32"
        INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - CORE: "rp2040:rp2040"
        FQBN: "rp2040:rp2040:rpipico"
        INDEX: "https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json"
      - CORE: "STMicroelectronics:stm32"
        FQBN: "STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_F411RE"
        INDEX: "https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"
      - CORE: "arduino:samd"
        FQBN: "arduino:samd:mkrzero"
        INDEX: ""
  cache:
    key: "arduino-$CORE"
    paths:
      - .arduino15/
      - .arduino-dl/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git python3
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index ${INDEX:+--additional-urls "$INDEX"}
    - arduino-cli core install "$CORE" ${INDEX:+--additional-urls "$INDEX"}
    - |
      set -e
      for ex in examples/*/; do
        name=$(basename "$ex")
        echo "=== $name ($FQBN) ==="
        arduino-cli compile --fqbn "$FQBN" --library . --warnings more                             --output-dir "build_arduino/$name" "$ex$name.ino"
      done
  artifacts:
    when: on_failure
    paths:
      - build_arduino/**/*.map
    expire_in: 1 week

# --- docs ---------------------------------------------------------------------

doxygen:
  stage: docs
  image: alpine:3.20
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile

# Das Wiki aus dem Repository nachziehen. GitLab hält ein Projekt-Wiki in einem
# eigenen Git-Repo direkt neben dem Projekt (<pfad>.wiki.git), Veröffentlichen
# ist also clone-commit-push und braucht keine API. tools/wiki_build.py erzeugt
# die Seiten aus README, COMPLIANCE, den Dateikommentaren der Beispiele und den
# @brief der Module; tools/wiki-sync.sh schiebt sie hoch.
#
# Warum ein eigener Token: CI_JOB_TOKEN darf lesen, aber in kein Git-Repo
# schreiben — ein Push damit endet mit 403. Nötig ist ein Project Access Token
# (Rolle Developer, Scope write_repository) als maskierte CI-Variable WIKI_TOKEN.
# Bei einem Deploy-Token zusätzlich WIKI_TOKEN_USER auf dessen Benutzernamen.
# Das Wiki muss außerdem unter Settings → General → Visibility aktiviert sein.
#
# Solange WIKI_TOKEN fehlt, existiert dieser Job gar nicht (rules unten): die
# Pipeline bleibt grün, statt an einer nicht gesetzten Variablen zu scheitern.
#
# Nur auf dem Default-Branch, und weil docs die letzte Stufe ist, erst wenn test
# und build durch sind — ein Wiki, das einen kaputten Stand beschreibt, ist
# schlechter als ein etwas älteres.
wiki:
  stage: docs
  image: alpine:3.20
  before_script:
    # git, weil tools/wiki-sync.sh das Wiki-Repo klont und hineinschiebt. bash,
    # weil die Skripte in tools/ dagegen geschrieben und getestet sind; alpine
    # bringt nur ash mit. python3 für tools/wiki_build.py.
    - apk add --no-cache bash git python3
  script:
    # Ausdrücklich über bash und nicht als ./tools/wiki-sync.sh: das x-Bit
    # überlebt einen Commit von einem Windows-Klon nicht zwangsläufig
    # (core.filemode=false), und ein Job, der daran mit "Permission denied"
    # stirbt, wäre schwer zu erklären.
    - bash tools/wiki-sync.sh --push
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN'

# GitLab Pages: die generierte API-Dokumentation von main veröffentlichen.
#
# Blockiert die Pipeline nicht, und zwar aus einem Grund, der nichts mit diesem
# Repository zu tun hat: der nginx vor der Instanz nimmt 1 MB pro Request an,
# das public-Artefakt ist größer, und der Upload endet mit "413 Request Entity
# Too Large". Pages wird ausschließlich über dieses Artefakt befüllt, es lässt
# sich also nicht wegoptimieren. Sobald das Limit oben ist, veröffentlicht der
# Job von selbst:
#
#   nginx['client_max_body_size'] = '0'   in /etc/gitlab/gitlab.rb
#   + gitlab-ctl reconfigure
#
# Dasselbe Limit deckelt übrigens git-push über HTTPS und jeden Anhang in der
# Weboberfläche. Wenn es fällt, gehört dieses allow_failure weg.
pages:
  stage: docs
  image: alpine:3.20
  needs:
    - job: doxygen
      artifacts: false
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile
    - mv docs/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- release ------------------------------------------------------------------

# Erzeugt aus einem annotierten Tag ein GitLab-Release-Objekt.
#
# Warum überhaupt: vorher war ein Release ein Tag und sonst nichts. Wer die
# Bibliothek zieht, sieht unter Releases eine leere Seite und muss den Changelog
# im Repository suchen. Das Release-Objekt ist die Stelle, an der GitLab, die API
# und jede Integration nachschlagen.
#
# Die Beschreibung kommt aus CHANGELOG.md und nicht aus der Tag-Nachricht: der
# Changelog wird im Merge Request gelesen und geprüft, eine Tag-Nachricht nicht.
# tools/changelog_section.py schneidet den Abschnitt heraus und endet mit einem
# Fehler, wenn es ihn nicht gibt — man kann also nicht taggen, ohne den Eintrag
# geschrieben zu haben.
#
# Nur release_*, nicht prerelease_*: ein Release ist etwas, das man installiert.
#
# Keine hochgeladenen Assets, sondern Links auf Archive, die GitLab auf Anfrage
# selbst erzeugt. Das ist kein Stilentscheid: ein Upload liefe in dasselbe
# 1-MB-Limit wie pages oben. Ein Quellarchiv des Tags enthält die Bibliothek
# ohnehin vollständig.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version-matches-tag
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: vendor-unmodified
      artifacts: false
    - job: arduino-lint
      artifacts: false
    - job: doxygen
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release_[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 tools/changelog_section.py "${CI_COMMIT_TAG#release_}" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "CrsfPort ${CI_COMMIT_TAG#release_}"
    description: ./release_notes.md
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: "Source (tar.gz)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tar.gz"
          link_type: package
        - name: "Source (zip)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
          link_type: package
